[package]
name = "murmur-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "murmur relay: auth, device registry, frame routing. Sees only ciphertext."

[dependencies]
murmur-proto = { path = "../shared/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.27"
hex = "0.4"
sha2 = "0.10"
