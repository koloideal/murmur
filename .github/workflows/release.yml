name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: build musl binaries (rust-lld, fully static)
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            RUSTFLAGS="-C linker=rust-lld" \
              cargo build --release --manifest-path server/Cargo.toml --target "$t"
            cp "server/target/$t/release/murmurs" "murmurs-$t"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: murmurs-*-linux-musl

  laptop:
    # Native runners per arch — no cross toolchain to babysit.
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: build murmurd + murmurctl + murmurt (glibc — Arch machines)
        run: |
          cargo build --release --manifest-path laptop/Cargo.toml
          for b in murmurd murmurctl murmurt; do
            cp "laptop/target/release/$b" "$b-${{ matrix.target }}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: "*-${{ matrix.target }}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: decode signing keystore
        run: echo "$MURMUR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/murmur.keystore"
        env:
          MURMUR_KEYSTORE_B64: ${{ secrets.MURMUR_KEYSTORE_B64 }}
      - name: build signed release APK
        run: cd mobile && ./gradlew assembleRelease --warning-mode all
        env:
          MURMUR_KEYSTORE_FILE: ${{ runner.temp }}/murmur.keystore
          MURMUR_KEYSTORE_PASSWORD: ${{ secrets.MURMUR_KEYSTORE_PASSWORD }}
          MURMUR_KEY_ALIAS: ${{ secrets.MURMUR_KEY_ALIAS }}
          MURMUR_KEY_PASSWORD: ${{ secrets.MURMUR_KEY_PASSWORD }}
      - run: cp mobile/app/build/outputs/apk/release/app-release.apk murmur-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: murmur-android.apk
