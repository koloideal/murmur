# Keeps the player daemon warm so the popup opens in ~10ms instead of ~1s.
exec-once = $HOME/.local/bin/murmur-player.py --daemon

# D-Bus-activated apps (e.g. murmur.player via its .service file) need the
# wayland session env — `--systemd` alone only reaches systemd services,
# the plain call updates the dbus-daemon activation environment too.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Hotkeys while hovering the island's track label — the hover watcher
# enters the "murmur" submap while the cursor is over it.
exec-once = $HOME/.local/bin/murmur-island-hover.py

submap = murmur
bind = , space, exec, playerctl -p murmur play-pause
binde = , right, exec, playerctl -p murmur position 5+
binde = , left, exec, playerctl -p murmur position 5-
bind = , n, exec, playerctl -p murmur next
bind = , p, exec, playerctl -p murmur previous
bind = , s, exec, playerctl -p murmur shuffle toggle
bind = , r, exec, sh -c 'c=$(playerctl -p murmur loop); case $c in None) n=Playlist;; Playlist) n=Track;; *) n=None;; esac; playerctl -p murmur loop $n'
bind = , escape, submap, reset
submap = reset
