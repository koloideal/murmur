[package]
name = "murmur-proto"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "murmur wire protocol: envelope, crypto, message types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.9"
